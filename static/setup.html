<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PaperSync · 设置</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20x='2'%20y='2'%20width='28'%20height='28'%20rx='6'%20fill='%23B53A2B'/%3E%3Crect%20x='5.5'%20y='5.5'%20width='21'%20height='21'%20rx='4'%20fill='none'%20stroke='rgba(255,255,255,0.5)'/%3E%3Ctext%20x='16'%20y='22.5'%20font-family='serif'%20font-size='17'%20fill='%23FBFBF8'%20text-anchor='middle'%3E%E7%A8%BF%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css?v=5">
</head>
<body class="setup-body">
<div id="setup-wrap">
  <div class="setup-card">
    <div class="wordmark setup-mark">
      <span class="seal-mark">稿</span>
      <div class="wordmark-text">
        <span class="wm-title">PaperSync</span>
        <span class="wm-sub">双语校稿</span>
      </div>
    </div>
    <p class="setup-lead">填好论文仓库与模型 key，即可开始中英双语校稿。所有信息只保存在本机 config.json。</p>

    <div id="ready-banner" class="ready-banner" hidden>
      <span>当前已配置论文：<b id="ready-repo"></b></span>
      <a href="/" class="btn-enter">进入编辑器 →</a>
      <p class="ready-note">下面的表单可用于更换论文，提交后覆盖现有配置。</p>
    </div>

    <form id="setup-form">
      <section class="setup-sec">
        <h2>论文仓库</h2>
        <label>GitHub 链接
          <input type="text" id="repo-url" placeholder="https://github.com/user/paper.git（公开仓库）">
        </label>
        <label>GitHub Token <span class="opt">（私有仓库必填，需 repo 权限）</span>
          <input type="password" id="github-token" placeholder="个人访问令牌…（可选，仅存本机）">
        </label>
        <div class="or-line">或</div>
        <label>本地路径 <span class="opt">（已有仓库/不想克隆时用）</span>
          <input type="text" id="repo-path" placeholder="/abs/path/to/paper">
        </label>
      </section>

      <section class="setup-sec">
        <h2>翻译与对话模型</h2>
        <div id="providers"></div>
        <button type="button" id="add-provider" class="add-provider">＋ 新增对话模型</button>
        <p class="prov-note">自定义模型需兼容 OpenAI 协议（base_url + api_key + model）。</p>
      </section>

      <div id="setup-error" class="setup-error" hidden></div>
      <button type="submit" id="setup-submit" class="setup-submit">开始校稿</button>
    </form>
  </div>
</div>
<script src="/setup.js?v=3"></script>
</body>
</html>
